name: Build VisionVNC

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pinned dependency versions (keep in sync with scripts/setup-deps.sh)
env:
  ROYALVNC_REF: '337197a'
  MOONLIGHT_COMMON_C_REF: '7b026e77be62175104640e7e722b758df6d3d0d7'
  OPUS_REF: '788cc89ce4f2c42025d8c70ec1b4457dc89cd50f'

# Build jobs only upload workflow artifacts; the release job at the bottom
# creates the GitHub Release with ALL assets in a single `gh release create`
# — required because releases are immutable (assets can't be added after
# publish).
jobs:
  # Both visionOS IPAs and the macOS companion, on one runner.
  #
  # Order matters for licensing: the MIT IPA is archived first, while the
  # Moonlight packages are empty stubs, so no GPL code can end up linked
  # into it. The stubs are then swapped for the real (patched) dependencies
  # and the GPLv3 Moonlight-enabled IPA is archived second.
  build-apple:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Clone and patch RoyalVNC
        run: |
          git clone https://github.com/royalapplications/royalvnc.git repos/royalvnc
          cd repos/royalvnc
          git checkout $ROYALVNC_REF
          # Static linking (dyld embedding fix) + VisionVNC API additions:
          # per-connection JPEG quality/compression settings and
          # pause/resumeFramebufferUpdates
          git apply ../../ci/patches/royalvnc-visionvnc.patch

      # The MIT build must not compile or link any Moonlight code, but the
      # project's local package references still need to resolve — stand in
      # empty stub packages with matching product names. Swapped for the
      # real dependencies after the MIT archive below.
      - name: Stub out Moonlight dependencies
        run: |
          for pkg in MoonlightCommonC Opus; do
            dir=$([ "$pkg" = "MoonlightCommonC" ] && echo repos/moonlight-common-c || echo repos/opus)
            mkdir -p "$dir/Sources/$pkg"
            cat > "$dir/Package.swift" <<EOF
          // swift-tools-version:5.9
          // CI stub — replaced with the real package for the Moonlight archive.
          import PackageDescription
          let package = Package(
              name: "$pkg",
              products: [.library(name: "$pkg", targets: ["$pkg"])],
              targets: [.target(name: "$pkg")]
          )
          EOF
            echo "// CI stub" > "$dir/Sources/$pkg/Stub.swift"
          done

      - name: Set build info (commit hash shown in Settings)
        run: ./scripts/set-build-info.sh "${GITHUB_SHA::7}"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNC

      - name: Build archive (VNC + Audio, Moonlight disabled)
        run: |
          xcodebuild archive \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNC \
            -destination 'generic/platform=visionOS' \
            -archivePath $RUNNER_TEMP/VisionVNC.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited)'

      - name: Create unsigned IPA
        run: |
          cd $RUNNER_TEMP/VisionVNC.xcarchive/Products/Applications
          mkdir -p $RUNNER_TEMP/Payload
          cp -R VisionVNC.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r VisionVNC-unsigned.ipa Payload

      # VisionVNCCompanion's ARCHS build setting is "arm64 x86_64" (project.pbxproj),
      # so this single archive command produces a universal binary covering both
      # Apple Silicon and Intel Macs — nothing extra needed on the command line.
      - name: Build Companion (macOS)
        run: |
          xcodebuild archive \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNCCompanion \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/VisionVNCCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Fail fast if a future project-settings change silently drops a slice.
      - name: Verify Companion is a universal binary
        run: |
          ARCHS=$(lipo -archs "$RUNNER_TEMP/VisionVNCCompanion.xcarchive/Products/Applications/VisionVNCCompanion.app/Contents/MacOS/VisionVNCCompanion")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::VisionVNCCompanion is not a universal arm64+x86_64 binary"; exit 1; }

      - name: Zip Companion app
        run: |
          cd $RUNNER_TEMP/VisionVNCCompanion.xcarchive/Products/Applications
          # ditto preserves bundle structure/extended attributes
          ditto -c -k --keepParent VisionVNCCompanion.app $RUNNER_TEMP/VisionVNCCompanion-unsigned.zip

      # Real dependencies for the Moonlight-enabled archive: drop the two
      # stub packages and let setup-deps.sh re-clone + patch them
      # (moonlight-common-c + enet with CommonCrypto/FEC patches, Opus with
      # the SPM umbrella patch). RoyalVNC is already in place and skipped.
      - name: Swap Moonlight stubs for real dependencies
        run: |
          rm -rf repos/moonlight-common-c repos/opus
          ./scripts/setup-deps.sh

      - name: Resolve packages (Moonlight)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNC

      - name: Build archive (VNC + Audio + Moonlight)
        run: |
          xcodebuild archive \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNC \
            -destination 'generic/platform=visionOS' \
            -archivePath $RUNNER_TEMP/VisionVNC-moonlight.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) MOONLIGHT_ENABLED'

      - name: Create unsigned Moonlight IPA
        run: |
          cd $RUNNER_TEMP/VisionVNC-moonlight.xcarchive/Products/Applications
          mkdir -p $RUNNER_TEMP/MoonlightPayload/Payload
          cp -R VisionVNC.app $RUNNER_TEMP/MoonlightPayload/Payload/
          cd $RUNNER_TEMP/MoonlightPayload
          zip -r $RUNNER_TEMP/VisionVNC-moonlight-unsigned.ipa Payload

      # The full macOS client (VNC + Moonlight + Audio + SSH + host/companion
      # features). It links moonlight-common-c, so like the Moonlight IPA it is
      # GPLv3 — built here in the real-dependency phase, never in the MIT phase.
      # MOONLIGHT_ENABLED is baked into the VisionVNCMac target's build settings,
      # so (unlike the visionOS scheme) we don't pass it on the command line.
      # ARCHS = "arm64 x86_64" is likewise baked in (project.pbxproj), so this
      # produces a universal binary covering Apple Silicon and Intel Macs. The
      # Opus dependency needs the ci/patches/opus-x86_64-universal.patch
      # (applied by setup-deps.sh above) to compile for x86_64 at all — it
      # guards the ARM NEON intrinsic sources to no-op on that arch.
      - name: Build full macOS app (VisionVNCMac, Moonlight)
        run: |
          xcodebuild archive \
            -project VisionVNC.xcodeproj \
            -scheme VisionVNCMac \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/VisionVNCMac.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Fail fast if a future project-settings or dependency-patch change
      # silently drops a slice.
      - name: Verify VisionVNCMac is a universal binary
        run: |
          ARCHS=$(lipo -archs "$RUNNER_TEMP/VisionVNCMac.xcarchive/Products/Applications/VisionVNCMac.app/Contents/MacOS/VisionVNCMac")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::VisionVNCMac is not a universal arm64+x86_64 binary"; exit 1; }

      - name: Zip full macOS app
        run: |
          cd $RUNNER_TEMP/VisionVNCMac.xcarchive/Products/Applications
          # ditto preserves bundle structure/extended attributes
          ditto -c -k --keepParent VisionVNCMac.app $RUNNER_TEMP/VisionVNCMac-unsigned.zip

      - name: Collect versioned artifacts
        run: |
          VERSION="0.1.0-${GITHUB_SHA::8}"
          mkdir -p dist
          cp $RUNNER_TEMP/VisionVNC-unsigned.ipa "dist/VisionVNC-${VERSION}-unsigned.ipa"
          cp $RUNNER_TEMP/VisionVNC-moonlight-unsigned.ipa "dist/VisionVNC-${VERSION}-moonlight-unsigned.ipa"
          cp $RUNNER_TEMP/VisionVNCCompanion-unsigned.zip "dist/VisionVNCCompanion-${VERSION}-unsigned.zip"
          cp $RUNNER_TEMP/VisionVNCMac-unsigned.zip "dist/VisionVNCMac-${VERSION}-unsigned.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: dist/*
          if-no-files-found: error

  # VisionVNC Windows Companion (Beta) installers — built natively per architecture:
  # x64 on windows-latest, arm64 on windows-11-arm (Snapdragon X-class laptops are
  # increasingly common). Self-contained .NET backend + Electron/NSIS installer.
  # Each emits a signed build-provenance attestation so anyone can prove the
  # installer was produced by this workflow from this commit and wasn't tampered
  # with: `gh attestation verify <exe> --repo <owner>/<repo>`. fail-fast is off so
  # one arch failing doesn't cancel the other.
  build-windows:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write       # OIDC token used to sign the provenance attestation
      attestations: write   # store the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            ebarch: x64
            arch: x64
          - runner: windows-11-arm
            rid: win-arm64
            ebarch: arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Self-contained publish — bundles the .NET runtime so the installer works
      # without a separate .NET install (electron-builder copies this into
      # resources/backend per package.json extraResources). The fixed -o path keeps
      # extraResources valid regardless of the RID.
      - name: Publish backend (self-contained, ${{ matrix.rid }})
        working-directory: CompanionWindows/backend
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -o bin/Release/net8.0-windows10.0.22621.0/publish

      # The running app reads this at startup to know which GitHub release to ask for the
      # closed-source PCVR bundle (see src/pcvr-installer.js) — the tag is the only thing
      # that guarantees the pipe protocol on both ends actually matches, so this has to be
      # the exact same string the release job below tags the release with.
      - name: Write build-info.json (release version + repo)
        shell: bash
        working-directory: CompanionWindows/app
        run: |
          VERSION="0.1.0-${GITHUB_SHA::8}"
          cat > src/build-info.json <<EOF
          { "version": "${VERSION}", "repo": "${{ github.repository }}" }
          EOF

      - name: Build installer (Electron + NSIS, ${{ matrix.arch }})
        working-directory: CompanionWindows/app
        run: |
          npm ci
          npm run dist -- --win --${{ matrix.ebarch }}

      - name: Name the installer with the release version + arch
        id: win
        shell: bash
        run: |
          VERSION="0.1.0-${GITHUB_SHA::8}"
          SRC=$(ls CompanionWindows/app/dist/*.exe | head -n1)
          mkdir -p dist-out
          DEST="dist-out/VisionVNCWindowsCompanion-${VERSION}-${{ matrix.arch }}-Setup.exe"
          cp "$SRC" "$DEST"
          echo "installer=$DEST" >> "$GITHUB_OUTPUT"

      # Record the checksum in the immutable build log + run summary as an extra,
      # independent integrity reference (compare against `sha256sum` of your download).
      - name: Print installer SHA-256
        shell: bash
        run: |
          echo "## Windows installer SHA-256 (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "${{ steps.win.outputs.installer }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.win.outputs.installer }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist-out/*
          if-no-files-found: error

  # Creates the (immutable) release with every asset in one shot. Runs even if
  # a Windows arch failed — the Apple artifacts are the release-critical ones,
  # and a missing installer can never be attached later, so ship what built
  # (the release notes mark the Windows installers "if present").
  release:
    needs: [build-apple, build-windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-apple.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.0-${GITHUB_SHA::8}"
          cat > release-notes.md <<EOF
          Built from \`$VERSION\`.

          **Assets**
          - \`VisionVNC-…-unsigned.ipa\` — VNC + Audio only (Moonlight disabled). All MIT-compatible.
          - \`VisionVNC-…-moonlight-unsigned.ipa\` — the Moonlight-enabled build (**GPLv3** — see below).
          - \`VisionVNCCompanion-…-unsigned.zip\` — the small macOS companion (menu-bar host: audio streaming, now-playing, broadcast/OBS, keyboard injection, SSH keys). Universal binary (Apple Silicon + Intel). MIT.
          - \`VisionVNCMac-…-unsigned.zip\` — the **full macOS app**: the VNC/Moonlight/Audio/SSH **client** plus all the companion host features in one app. Universal binary (Apple Silicon + Intel). Links Moonlight, so **GPLv3** (see below).
          - \`VisionVNCWindowsCompanion-…-x64-Setup.exe\` / \`…-arm64-Setup.exe\` — *if present*, the VisionVNC Windows Companion installer (**Beta**), built natively for Intel/AMD (x64) and Windows-on-ARM (arm64). Includes the Hotspot and native screen streaming host features, built entirely from this public source tree. PCVR / Foveated Streaming (CloudXR) support is a separate, closed-source component installed on top — the companion UI hides that panel entirely when it isn't present. Ships with a signed build-provenance attestation; verify before running with \`gh attestation verify <file> --repo ${{ github.repository }}\`.

          **Running the macOS apps**

          The macOS \`.zip\`s are unsigned, so Gatekeeper blocks them on first launch
          ("damaged / can't be opened"). After unzipping into \`/Applications\`,
          clear the quarantine flag and re-sign ad-hoc (substitute the app you
          downloaded — \`VisionVNCCompanion.app\` or \`VisionVNCMac.app\`):

          \`\`\`sh
          APP=/Applications/VisionVNCMac.app   # or VisionVNCCompanion.app
          xattr -dr com.apple.quarantine "\$APP"
          codesign --force --deep --sign - "\$APP"
          \`\`\`

          Then open it normally. (If you build it yourself with a real Apple
          Development identity, you can skip this.)

          ⚠️ **Licensing note:** the Moonlight-enabled IPA and the full macOS app
          (\`VisionVNCMac\`) link
          [moonlight-common-c](https://github.com/moonlight-stream/moonlight-common-c),
          which is **GPLv3**. Those artifacts are therefore distributed under the GPLv3,
          not the project's MIT terms. The VNC-only IPA and the small Companion contain
          no GPL code. See [LICENSE](LICENSE.txt) for details.
          EOF
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            dist/*
