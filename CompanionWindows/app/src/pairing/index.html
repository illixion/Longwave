<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Longwave Pairing Code</title>
  <link rel="stylesheet" href="pairing.css" />
</head>
<body>
  <main>
    <p class="eyebrow">Longwave PCVR</p>
    <h1>Scan with Vision Pro</h1>
    <p id="instructions">Click the masked code when you are ready to scan.</p>
    <button id="code" class="code masked" type="button" aria-label="Reveal pairing code">
      <span id="mask">
        <strong>PAIRING CODE MASKED</strong>
        <small>Click to reveal</small>
      </span>
      <img id="qr" alt="Longwave pairing QR code" />
    </button>
    <p class="privacy">The code is hidden by default to prevent shoulder-surfing. Click it again to mask it.</p>
  </main>
  <script src="pairing.js"></script>
</body>
</html>
